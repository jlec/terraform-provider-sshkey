---
name: Continuous Delivery

# yamllint disable-line rule:truthy
on:
  # yamllint disable-line rule:empty-values
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  goreleaser:
    name: "GO Releaser"
    uses: jlec/github-actions/.github/workflows/reusable-cd-tf-provider.yml@main

    permissions:
      contents: write
      statuses: write
    secrets:
      pat: ${{ secrets.GHA_PAT }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
      gpg_release_key: ${{ secrets.GPG_RELEASE_KEY }}
  release-and-clean:
    name: Release the code & clean up
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    needs:
      - goreleaser
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Cleanup action status
        uses: myrotvorets/set-commit-status-action@v2.0.1
        with:
          status: "success"
          token: ${{ secrets.GITHUB_TOKEN }}
          context: "GithubActions - ${GITHUB_WORKFLOW}"
